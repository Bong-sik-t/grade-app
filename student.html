<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>1학년 야자·석식 신청</title>
<!-- PWA -->
<link rel="manifest" href="/student-manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="야자신청">
<link rel="apple-touch-icon" href="/icon.svg">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="/firebase-ready.js"></script>
<style>
  :root {
    --navy:#1e3a5f; --navy2:#2d5282; --gold:#f59e0b; --green:#16a34a;
    --red:#dc2626; --g100:#f1f5f9; --g200:#e2e8f0; --g400:#94a3b8; --g600:#475569;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Noto Sans KR',sans-serif; background:#f8fafc; min-height:100vh; }

  /* 헤더 */
  .header {
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
    color:#fff; padding:20px 20px 16px; text-align:center;
  }
  .header h1 { font-size:20px; font-weight:900; letter-spacing:-0.5px; }
  .header p  { font-size:12px; opacity:.8; margin-top:4px; }

  /* 단계 표시 */
  .steps {
    display:flex; align-items:center; justify-content:center;
    gap:0; padding:14px 20px; background:#fff;
    border-bottom:2px solid var(--g200);
  }
  .step {
    display:flex; flex-direction:column; align-items:center;
    gap:4px; flex:1;
  }
  .step-circle {
    width:28px; height:28px; border-radius:50%;
    border:2px solid var(--g200); background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:var(--g400);
    transition:all .2s;
  }
  .step-circle.active { background:var(--navy); border-color:var(--navy); color:#fff; }
  .step-circle.done   { background:var(--green); border-color:var(--green); color:#fff; }
  .step-label { font-size:10px; color:var(--g400); font-weight:700; }
  .step-label.active { color:var(--navy); }
  .step-divider { width:30px; height:2px; background:var(--g200); margin-bottom:14px; flex-shrink:0; }
  .step-divider.done { background:var(--green); }

  /* 컨테이너 */
  .container { max-width:480px; margin:0 auto; padding:20px 16px 80px; }

  /* 섹션 카드 */
  .card {
    background:#fff; border-radius:16px; padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:16px;
  }
  .card-title {
    font-size:13px; font-weight:800; color:var(--navy);
    margin-bottom:14px; display:flex; align-items:center; gap:6px;
  }

  /* 반 선택 */
  .cls-grid {
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  }
  .cls-btn {
    padding:12px 4px; border-radius:10px;
    border:2px solid var(--g200); background:#fff;
    font-size:14px; font-weight:800; cursor:pointer; color:var(--g600);
    transition:all .15s;
  }
  .cls-btn:active { transform:scale(.95); }
  .cls-btn.selected { background:var(--navy); border-color:var(--navy); color:#fff; }

  /* 학생 선택 */
  .student-list {
    display:flex; flex-direction:column; gap:2px;
    max-height:320px; overflow-y:auto;
    border:1px solid var(--g200); border-radius:10px;
  }
  .student-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 14px; cursor:pointer;
    border-bottom:1px solid var(--g200); transition:background .1s;
  }
  .student-item:last-child { border-bottom:none; }
  .student-item:active { background:var(--g100); }
  .student-item.selected { background:#eff6ff; }
  .student-num { font-size:12px; color:var(--g400); min-width:24px; font-weight:700; }
  .student-name { font-size:15px; font-weight:800; flex:1; }
  .student-check { font-size:18px; }

  /* 월 선택 */
  .month-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .month-btn {
    padding:8px 14px; border-radius:20px;
    border:2px solid var(--g200); background:#fff;
    font-size:13px; font-weight:800; cursor:pointer; color:var(--g600);
    transition:all .15s;
  }
  .month-btn.selected { background:var(--navy); border-color:var(--navy); color:#fff; }

  /* 야자/석식 선택 */
  .apply-group { margin-bottom:20px; }
  .apply-group-title {
    font-size:12px; font-weight:800; color:var(--g400);
    margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px;
  }
  .apply-options { display:flex; flex-direction:column; gap:8px; }
  .apply-option {
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; border-radius:12px;
    border:2px solid var(--g200); cursor:pointer;
    transition:all .15s; background:#fff;
  }
  .apply-option:active { transform:scale(.98); }
  .apply-option.selected { border-color:var(--navy); background:#eff6ff; }
  .apply-option.selected .opt-circle { background:var(--navy); border-color:var(--navy); }
  .apply-option.selected .opt-circle::after { opacity:1; }
  .opt-circle {
    width:20px; height:20px; border-radius:50%;
    border:2px solid var(--g200); position:relative; flex-shrink:0;
    transition:all .15s;
  }
  .opt-circle::after {
    content:''; position:absolute; inset:3px;
    border-radius:50%; background:#fff; opacity:0; transition:opacity .15s;
  }
  .opt-label { flex:1; }
  .opt-title { font-size:14px; font-weight:800; }
  .opt-desc  { font-size:11px; color:var(--g400); margin-top:2px; }
  .opt-icon  { font-size:22px; }

  /* 토글 스위치 */
  .toggle-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid var(--g200);
  }
  .toggle-row:last-child { border-bottom:none; }
  .toggle-info .toggle-title { font-size:14px; font-weight:800; }
  .toggle-info .toggle-desc  { font-size:11px; color:var(--g400); margin-top:2px; }
  .toggle-switch {
    position:relative; width:48px; height:26px;
    background:var(--g200); border-radius:13px;
    cursor:pointer; transition:background .2s; flex-shrink:0;
  }
  .toggle-switch.on { background:var(--navy); }
  .toggle-knob {
    position:absolute; top:3px; left:3px;
    width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2);
    transition:transform .2s;
  }
  .toggle-switch.on .toggle-knob { transform:translateX(22px); }

  /* 요약 카드 */
  .summary-box {
    background:var(--g100); border-radius:12px; padding:16px;
    margin-bottom:16px;
  }
  .summary-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px solid var(--g200);
  }
  .summary-row:last-child { border-bottom:none; }
  .summary-label { font-size:13px; color:var(--g600); font-weight:700; }
  .summary-value { font-size:13px; font-weight:900; color:var(--navy); }
  .summary-value.green { color:var(--green); }
  .summary-value.red   { color:var(--red); }

  /* 버튼 */
  .btn-primary {
    width:100%; padding:16px; border-radius:14px;
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:#fff; font-size:16px; font-weight:900;
    border:none; cursor:pointer; letter-spacing:-.3px;
    box-shadow:0 4px 12px rgba(30,58,95,.3);
    transition:all .15s;
  }
  .btn-primary:active { transform:scale(.98); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-secondary {
    width:100%; padding:12px; border-radius:12px;
    background:#fff; color:var(--navy); font-size:14px; font-weight:800;
    border:2px solid var(--navy); cursor:pointer; margin-top:10px;
    transition:all .15s;
  }
  .btn-secondary:active { background:var(--g100); }

  /* 완료 화면 */
  .done-screen {
    text-align:center; padding:40px 20px;
  }
  .done-icon { font-size:64px; margin-bottom:16px; }
  .done-title { font-size:22px; font-weight:900; color:var(--navy); margin-bottom:8px; }
  .done-sub   { font-size:14px; color:var(--g600); line-height:1.6; }

  /* 로딩 */
  .loading-overlay {
    position:fixed; inset:0;
    background:rgba(255,255,255,.9);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:999; gap:14px;
  }
  .spinner {
    width:40px; height:40px; border-radius:50%;
    border:4px solid var(--g200); border-top-color:var(--navy);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; font-weight:800; color:var(--navy); }

  /* 알림 토스트 */
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
    background:rgba(15,23,42,.9); color:#fff;
    padding:12px 20px; border-radius:24px; font-size:13px; font-weight:700;
    white-space:nowrap; z-index:9999; transition:transform .3s;
    pointer-events:none;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* 숨김 */
  .screen { display:none; }
  .screen.active { display:block; }
</style>
</head>

<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">처리 중...</div>
</div>

<div class="header">
  <h1>🏫 경남고 1학년 야자·석식 신청</h1>
  <p id="header-sub">신청 정보를 입력해주세요</p>
</div>

<!-- 단계 표시 -->
<div class="steps">

  <div class="step-divider" id="div1"></div>
  <div class="step">
    <div class="step-circle" id="step2-circle">2</div>
    <div class="step-label" id="step2-label">월 선택</div>
  </div>
  <div class="step-divider" id="div2"></div>
  <div class="step">
    <div class="step-circle" id="step3-circle">3</div>
    <div class="step-label" id="step3-label">신청 항목</div>
  </div>
  <div class="step-divider" id="div3"></div>
  <div class="step">
    <div class="step-circle" id="step4-circle">4</div>
    <div class="step-label" id="step4-label">확인·제출</div>
  </div>
</div>

<div class="container">

  <!-- 신청 기간 외 안내 화면 -->
  <div id="screen-closed" class="screen" style="display:none;">
    <div class="card" style="text-align:center;padding:40px 24px;">
      <div style="font-size:56px;margin-bottom:16px;">🔒</div>
      <div style="font-size:20px;font-weight:900;color:var(--navy);margin-bottom:12px;">신청 기간이 아닙니다</div>
      <div id="closed-msg" style="font-size:14px;color:#64748b;line-height:1.7;"></div>
    </div>
  </div>

  <!-- STEP 1: 반 & 학생 선택 -->
  <div id="screen-1" class="screen">
    <div class="card">
      <div class="card-title">🏷 반 선택</div>
      <div class="cls-grid" id="cls-grid"></div>
    </div>
    <div class="card" id="student-card" style="display:none;">
      <div class="card-title">👤 학생 선택</div>
      <div class="student-list" id="student-list"></div>
    </div>
    <button class="btn-primary" id="btn-step1" onclick="goStep(2)" disabled>다음 →</button>
  </div>

  <!-- STEP 2: 월 선택 -->
  <div id="screen-2" class="screen">
    <div class="card">
      <div class="card-title">📅 신청 월 선택</div>
      <div class="month-grid" id="month-grid"></div>
      <p style="font-size:11px;color:var(--g400);margin-top:12px;">
        * 해당 월 전체에 대한 신청입니다.
      </p>
    </div>
    <button class="btn-primary" id="btn-step2" onclick="goStep(3)" disabled>다음 →</button>
    <button class="btn-secondary" onclick="goStep(1)">← 이전</button>
  </div>

  <!-- STEP 3: 요일별 야자·석식 선택 -->
  <div id="screen-3" class="screen">
    <div class="card">
      <div class="card-title">📅 요일별 야자·석식 신청</div>
      <p style="font-size:12px;color:#94a3b8;margin-bottom:14px;">요일별로 야자 수준과 석식 여부를 선택하세요.</p>
      <div id="dow-cards"></div>
    </div>
    <button class="btn-primary" id="btn-step3" onclick="goStep(4)">다음 →</button>
    <button class="btn-secondary" onclick="goStep(2)">← 이전</button>
  </div>

  <!-- STEP 4: 확인 및 제출 -->
  <div id="screen-4" class="screen">
    <div class="card">
      <div class="card-title">✅ 신청 내용 확인</div>
      <div class="summary-box" id="summary-box"></div>
      <p style="font-size:11px;color:var(--g400);line-height:1.7;">
        위 내용이 맞으면 <b>신청하기</b> 버튼을 눌러주세요.<br>
        잘못된 내용은 이전 버튼으로 수정할 수 있습니다.
      </p>
    </div>
    <button class="btn-primary" onclick="submitApplication()">📨 신청하기</button>
    <button class="btn-secondary" onclick="goStep(3)">← 이전</button>
  </div>

  <!-- 완료 화면 -->
  <div id="screen-done" class="screen">
    <div class="done-screen">
      <div class="done-icon">🎉</div>
      <div class="done-title">신청 완료!</div>
      <div class="done-sub" id="done-msg"></div>
    </div>
    <button class="btn-primary" onclick="resetForm()">새로 신청하기</button>
  </div>

</div>

<div class="toast" id="toast"></div>

  '1-7': [{num:1,name:'강도현'}, {num:2,name:'고부성'}, {num:3,name:'공장우'}, {num:4,name:'곽민준'}, {num:5,name:'구현명'}, {num:6,name:'김규현'}, {num:7,name:'김도형'}, {num:8,name:'김세현'}, {num:9,name:'김에덴'}, {num:10,name:'박서우'}, {num:11,name:'박세진'}, {num:12,name:'손민재'}, {num:13,name:'윤희범'}, {num:14,name:'이동우'}, {num:15,name:'이상인'}, {num:16,name:'이성윤'}, {num:17,name:'이승민'}, {num:18,name:'임태경'}, {num:19,name:'임효준'}, {num:20,name:'정예찬'}, {num:21,name:'정재원'}, {num:22,name:'조성호'}, {num:23,name:'최경민'}, {num:24,name:'최호영'}, {num:25,name:'김상훈'}, {num:26,name:'박찬욱'}],
};

// Firebase 기반 — GAS 대신 Firebase에서 직접 읽기/쓰기

// 요일 상수
const DOW_KEYS   = ['mon','tue','wed','thu','fri'];
const DOW_LABELS = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금'};
const DOW_FULL   = {mon:'월요일',tue:'화요일',wed:'수요일',thu:'목요일',fri:'금요일'};

// 상태
var appClosed = false;  // 신청 기간 외이면 true
var selCls    = null;
var selIdx    = null;
var selMonth  = null;
var curStep   = 1;
// 요일별 신청 상태
var selDow = {};
DOW_KEYS.forEach(function(k){ selDow[k] = {yaja: 'none', seoksi: false}; });

// 학생 명단을 studentRoster 기준으로 CLASS_STUDENTS 동기화
var STATUS_ACTIVE_SET = new Set(['active','transfer_in']);
function syncRosterToClassStudents(studentRoster) {
  if (!studentRoster || !studentRoster.length) return;
  // 전입 등 추가된 학생 반영
  studentRoster.forEach(function(s) {
    if (!CLASS_STUDENTS[s.cls]) return;
    if (!CLASS_STUDENTS[s.cls].find(function(x){ return x.num===s.num&&x.name===s.name; })) {
      CLASS_STUDENTS[s.cls].push({ num: s.num, name: s.name });
      CLASS_STUDENTS[s.cls].sort(function(a,b){ return a.num-b.num; });
    }
  });
  // 전출·자퇴 등 비활성 학생 제거
  CLASSES.forEach(function(cls) {
    CLASS_STUDENTS[cls] = CLASS_STUDENTS[cls].filter(function(x) {
      var entry = studentRoster.find(function(s){ return s.cls===cls&&s.num===x.num&&s.name===x.name; });
      // studentRoster에 없으면 원래 명단(원적 학생) → 유지
      // studentRoster에 있는데 비활성이면 제거
      return !entry || STATUS_ACTIVE_SET.has(entry.status);
    });
  });
}

// ── 초기화 ──
window.addEventListener('load', function() {
  showLoading('확인 중...');
  fbInit();
  // Firebase에서 appPeriod + studentRoster만 로드
  Promise.all([
    fbRef('appPeriod').once('value'),
    fbRef('studentRoster').once('value')
  ]).then(function(snaps) {
    var period  = snaps[0].val() || {};
    var rosterRaw = snaps[1].val();

    // studentRoster 동기화
    var roster = [];
    if (rosterRaw) {
      roster = Array.isArray(rosterRaw) ? rosterRaw : Object.values(rosterRaw);
    }
    if (roster.length) syncRosterToClassStudents(roster);

    // 신청 기간 판단 (start/end 모두 비어있으면 항상 열림)
    var today = new Date().toISOString().slice(0, 10);
    var s = period.start || '', e = period.end || '';
    var isOpen = (!s || today >= s) && (!e || today <= e);

    hideLoading();

    if (!isOpen) {
      // 신청 기간 외
      var msg = '';
      if (s && e) {
        msg = '신청 기간: <b>' + s + '</b> ~ <b>' + e + '</b><br><br>해당 기간에 다시 접속해주세요.';
      } else if (s) {
        msg = '신청 시작일: <b>' + s + '</b><br><br>해당 날짜 이후에 접속해주세요.';
      } else {
        msg = '현재 신청 기간이 아닙니다.<br>담임 선생님께 문의하세요.';
      }
      document.getElementById('closed-msg').innerHTML = msg;
      appClosed = true;
      document.getElementById('screen-closed').style.display = 'block';
      document.getElementById('screen-closed').classList.add('active');
      var stepBar = document.querySelector('.steps');
      if (stepBar) stepBar.style.display = 'none';
    } else {
      buildClsGrid();
      buildMonthGrid();
      updateStep(1);
      document.getElementById('screen-1').classList.add('active');
    }
  }).catch(function() {
    hideLoading();
    // Firebase 연결 실패 시 일단 열어줌
    buildClsGrid();
    buildMonthGrid();
    updateStep(1);
    document.getElementById('screen-1').classList.add('active');
  });
});

function buildClsGrid() {
  document.getElementById('cls-grid').innerHTML = CLASSES.map(function(c) {
    return '<button class="cls-btn" onclick="selectCls(\''+c+'\')" id="cls-btn-'+c+'">'+c+'</button>';
  }).join('');
}

function buildMonthGrid() {
  var now = new Date();
  var curMonth = now.getMonth() + 1;
  document.getElementById('month-grid').innerHTML = MONTHS.map(function(m) {
    var isCur = m === curMonth;
    return '<button class="month-btn'+(isCur?' selected':'')+'" onclick="selectMonth('+m+')" id="month-btn-'+m+'">'+m+'월</button>';
  }).join('');
  // 현재 월 기본 선택
  selMonth = curMonth;
  document.getElementById('btn-step2').disabled = false;
}

function selectCls(cls) {
  selCls = cls; selIdx = null;
  document.querySelectorAll('.cls-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.getElementById('cls-btn-'+cls).classList.add('selected');
  document.getElementById('btn-step1').disabled = true;
  // 학생 목록 렌더
  var students = CLASS_STUDENTS[cls];
  var card = document.getElementById('student-card');
  card.style.display = 'block';
  document.getElementById('student-list').innerHTML = students.map(function(s, i) {
    return '<div class="student-item" onclick="selectStudent('+i+')" id="stu-'+i+'">'
      + '<span class="student-num">'+s.num+'</span>'
      + '<span class="student-name">'+s.name+'</span>'
      + '<span class="student-check" id="chk-'+i+'"></span>'
      + '</div>';
  }).join('');
}

function selectStudent(i) {
  selIdx = i;
  document.querySelectorAll('.student-item').forEach(function(el){ el.classList.remove('selected'); });
  document.querySelectorAll('.student-check').forEach(function(el){ el.textContent = ''; });
  var item = document.getElementById('stu-'+i);
  item.classList.add('selected');
  document.getElementById('chk-'+i).textContent = '✅';
  document.getElementById('btn-step1').disabled = false;
  // 스크롤 살짝 올려주기
  item.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function selectMonth(m) {
  selMonth = m;
  document.querySelectorAll('.month-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.getElementById('month-btn-'+m).classList.add('selected');
  document.getElementById('btn-step2').disabled = false;
}

function buildDowCards() {
  var yajaCols = [
    {val:'none', label:'신청 안 함', icon:'✋', desc:''},
    {val:'p8',   label:'8교시만',    icon:'📖', desc:'~18:00'},
    {val:'y1',   label:'야자 1교시', icon:'🌙', desc:'~19:50'},
    {val:'y2',   label:'야자 2교시', icon:'🌠', desc:'~21:00'},
  ];
  var container = document.getElementById('dow-cards');
  container.innerHTML = '';

  DOW_KEYS.forEach(function(k) {
    var state = selDow[k];
    var wrap = document.createElement('div');
    wrap.style.marginBottom = '16px';

    // 요일 제목
    var title = document.createElement('div');
    title.style.cssText = 'font-size:13px;font-weight:900;color:var(--navy);margin-bottom:8px;padding:6px 10px;background:#f0f5ff;border-radius:8px;';
    title.textContent = DOW_FULL[k];
    wrap.appendChild(title);

    // 야자 버튼들
    var btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;';
    yajaCols.forEach(function(opt) {
      var on = state.yaja === opt.val;
      var btn = document.createElement('button');
      btn.style.cssText = 'flex:1;min-width:60px;padding:8px 4px;border-radius:10px;border:2px solid '+(on?'var(--navy)':'#e2e8f0')+';background:'+(on?'var(--navy)':'#fff')+';color:'+(on?'#fff':'#64748b')+';font-size:12px;font-weight:800;cursor:pointer;';
      btn.innerHTML = opt.icon + '<br>' + opt.label + (opt.desc ? '<br><span style="font-size:10px;opacity:.7;">'+opt.desc+'</span>' : '');
      btn.onclick = (function(dow, val){ return function(){ setDowYaja(dow, val); }; })(k, opt.val);
      btnRow.appendChild(btn);
    });
    wrap.appendChild(btnRow);

    // 석식 토글
    var seoksiRow = document.createElement('div');
    var canSeoksi = state.yaja !== 'none';
    seoksiRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#f8fafc;border-radius:8px;opacity:'+(canSeoksi?1:0.4)+';';
    var seoksiLabel = document.createElement('span');
    seoksiLabel.style.cssText = 'font-size:13px;font-weight:700;';
    seoksiLabel.textContent = '🍚 석식 신청';
    var toggle = document.createElement('div');
    toggle.className = 'toggle-switch' + (state.seoksi ? ' on' : '');
    toggle.style.cursor = canSeoksi ? 'pointer' : 'not-allowed';
    toggle.innerHTML = '<div class="toggle-knob"></div>';
    toggle.onclick = (function(dow){ return function(){ setDowSeoksi(dow); }; })(k);
    seoksiRow.appendChild(seoksiLabel);
    seoksiRow.appendChild(toggle);
    wrap.appendChild(seoksiRow);

    container.appendChild(wrap);
  });
}

function setDowYaja(dow, val) {
  selDow[dow].yaja = val;
  selDow[dow].seoksi = (val !== 'none');
  // 하나라도 야자 신청이 있으면 월~금 전체 석식 자동 신청
  var anyYaja = DOW_KEYS.some(function(k) { return selDow[k].yaja !== 'none'; });
  DOW_KEYS.forEach(function(k) {
    if (anyYaja) selDow[k].seoksi = true;
    else selDow[k].seoksi = false;
  });
  buildDowCards();
}
function setDowSeoksi(dow) {
  if (selDow[dow].yaja === 'none') { showToast('⚠️ 야자를 먼저 선택해주세요'); return; }
  selDow[dow].seoksi = !selDow[dow].seoksi;
  buildDowCards();
}

// ── 단계 이동 ──
function goStep(n) {
  if (appClosed) return;  // 신청 기간 외 — 이동 차단
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  if (n <= 4) {
    document.getElementById('screen-'+n).classList.add('active');
    curStep = n;
    updateStep(n);
    if (n === 3) buildDowCards();
    if (n === 4) buildSummary();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateStep(n) {
  [1,2,3,4].forEach(function(i) {
    var c = document.getElementById('step'+i+'-circle');
    var l = document.getElementById('step'+i+'-label');
    if (i < n) { c.className='step-circle done'; c.textContent='✓'; }
    else if (i === n) { c.className='step-circle active'; c.textContent=i; }
    else { c.className='step-circle'; c.textContent=i; }
    l.className = 'step-label' + (i===n?' active':'');
    if (i < 4) {
      document.getElementById('div'+i).className = 'step-divider' + (i<n?' done':'');
    }
  });
  // 헤더 부제목
  var subs = ['','반·학생을 선택하세요','신청 월을 선택하세요','야자·석식 항목을 선택하세요','내용을 확인하고 제출하세요'];
  document.getElementById('header-sub').textContent = subs[n] || '';
}

function buildSummary() {
  var s = CLASS_STUDENTS[selCls][selIdx];
  var yajaLabels = {none:'—', p8:'8교시', y1:'야자1교시', y2:'야자2교시'};
  var dowRows = DOW_KEYS.map(function(k) {
    var st = selDow[k];
    var yajaStr = yajaLabels[st.yaja] || '—';
    var seoksiStr = st.seoksi ? '🍚 석식' : '';
    return row(DOW_FULL[k], yajaStr + (seoksiStr?' + '+seoksiStr:''), st.yaja!=='none'?'green':'');
  }).join('');
  document.getElementById('summary-box').innerHTML =
    row('학급', selCls+'반') +
    row('학생', s.num+'번 '+s.name) +
    row('신청 월', selMonth+'월') +
    dowRows;
}
function row(label, value, cls) {
  return '<div class="summary-row"><span class="summary-label">'+label+'</span>'
    +'<span class="summary-value'+(cls?' '+cls:'')+'">'+value+'</span></div>';
}

// ── 제출 ──
function submitApplication() {
  if (appClosed) { showToast('신청 기간이 아닙니다'); return; }
  if (!selCls || selIdx===null || !selMonth) {
    showToast('⚠️ 반·학생·월을 선택해주세요'); return;
  }
  showLoading('신청 중...');

  // 요일별 신청 데이터 구성 (Firebase 경로: yajaData/{month}/{cls}/{idx}/{dow})
  var yajaEntry = {}, seoksiEntry = {};
  DOW_KEYS.forEach(function(k) {
    var st = selDow[k];
    yajaEntry[k] = {
      p8: (st.yaja==='p8'||st.yaja==='y1'||st.yaja==='y2'),
      y1: (st.yaja==='y1'||st.yaja==='y2'),
      y2: (st.yaja==='y2')
    };
    seoksiEntry[k] = !!st.seoksi;
  });

  // Firebase 경로별 업데이트 (한 번에 원자적으로 저장)
  var updates = {};
  updates['yajaData/'   + selMonth + '/' + selCls + '/' + selIdx] = yajaEntry;
  updates['seoksiData/' + selMonth + '/' + selCls + '/' + selIdx] = seoksiEntry;

  fbRef('').update(updates)
    .then(function() {
      hideLoading();
      var s = CLASS_STUDENTS[selCls][selIdx];
      var doneDetails = DOW_KEYS.map(function(k){
        var st = selDow[k];
        var lb = {none:'—',p8:'8교시',y1:'야자1',y2:'야자2'}[st.yaja];
        return DOW_FULL[k]+': <b>'+lb+'</b>'+(st.seoksi?' + 석식':'');
      }).join('<br>');
      document.getElementById('done-msg').innerHTML =
        '<b>'+selCls+'반 '+s.num+'번 '+s.name+'</b> 학생<br>'+
        selMonth+'월 신청이 완료되었습니다.<br><br>'+doneDetails;
      document.querySelectorAll('.screen').forEach(function(sc){ sc.classList.remove('active'); });
      document.getElementById('screen-done').classList.add('active');
    })
    .catch(function(e) {
      hideLoading();
      showToast('❌ 저장 실패: ' + e.message);
    });
}

function resetForm() {
  selCls=null; selIdx=null;
  DOW_KEYS.forEach(function(k){ selDow[k]={yaja:'none',seoksi:false}; });
  selMonth = new Date().getMonth()+1;
  document.querySelectorAll('.cls-btn').forEach(function(b){ b.classList.remove('selected'); });
  document.getElementById('student-card').style.display='none';
  buildMonthGrid();
  goStep(1);
}

function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg||'처리 중...';
  document.getElementById('loading-overlay').style.display='flex';
}
function hideLoading() {
  document.getElementById('loading-overlay').style.display='none';
}
function showToast(msg) {
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
